[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "house-price-api"
version = "0.1.0"
description = "A FastAPI service for housing price predictions."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27,<1.0",
    "joblib>=1.3",
    "pandas>=2.1",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["httpx2>=2.0", "pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"